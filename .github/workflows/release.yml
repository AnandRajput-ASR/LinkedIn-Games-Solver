name: Create browser extension release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build browser extensions
        run: node build.js --release --minify

      - name: Package Chrome extension
        working-directory: chrome-dist
        run: zip -qr ../linkedin-games-solver-chrome.zip .

      - name: Package Firefox extension
        working-directory: firefox-dist
        run: zip -qr ../linkedin-games-solver-firefox.zip .

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            linkedin-games-solver-chrome.zip
            linkedin-games-solver-firefox.zip
